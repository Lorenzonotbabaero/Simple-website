<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>About me!</title>


  <!-- =========================
       FONT AWESOME
  ========================== -->

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >


  <!-- =========================
       CSS
  ========================== -->

  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- =========================
       EMAILJS
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"
  ></script>

  <script>

    emailjs.init({
      publicKey: "yWCbXVy9EpRv6Dt_c"
    });

  </script>

</head>


<body>


  <!-- =========================
       BACKGROUND MUSIC
  ========================== -->

  <audio
    id="background-music"
    src="Files/musicB.mp3"
    autoplay
    loop
    preload="auto"
  ></audio>


  <!-- =========================
       BACKGROUND VIDEO
  ========================== -->

  <video
    class="background-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >

    <source
      src="Files/an.mp4"
      type="video/mp4"
    >

  </video>


  <div class="video-overlay"></div>



  <!-- =========================
       MAIN
  ========================= -->

  <main class="container">


    <!-- =========================
         PROFILE
    ========================== -->

    <div class="profile">

      <img
        src="Files/photo.jpeg"
        alt="Lorenzo II C. Badilla"
      >

    </div>



    <!-- =========================
         NAME
    ========================== -->

    <h1>
      Lorenzo II C. Badilla
    </h1>


    <p class="description">
      Welcome to my personal website.
    </p>



    <!-- =========================
         SOCIAL BUTTONS
    ========================== -->

    <div class="socials">


      <!-- TIKTOK -->

      <a
        class="social-btn tiktok"
        href="https://www.tiktok.com/@loren.zoofficial"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="social-icon">

          <i class="fa-brands fa-tiktok"></i>

        </span>


        <span class="social-name">
          TikTok
        </span>


        <span class="arrow">
          →
        </span>

      </a>



      <!-- FACEBOOK -->

      <a
        class="social-btn facebook"
        href="https://www.facebook.com/share/1JCAwrrqA8/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="social-icon">

          <i class="fa-brands fa-facebook"></i>

        </span>


        <span class="social-name">
          Facebook
        </span>


        <span class="arrow">
          →
        </span>

      </a>



      <!-- INSTAGRAM -->

      <a
        class="social-btn instagram"
        href="https://www.instagram.com/lor.zxa?stkn=OGl2Yjl0MzRxaHFq"
        target="_blank"
        rel="noopener noreferrer"
      >

        <span class="social-icon">

          <i class="fa-brands fa-instagram"></i>

        </span>


        <span class="social-name">
          Instagram
        </span>


        <span class="arrow">
          →
        </span>

      </a>



      <!-- SEND MESSAGE -->

      <button
        type="button"
        class="social-btn message-btn"
        id="open-message"
      >

        <span class="message-icon">

          <i class="fa-solid fa-envelope"></i>

        </span>


        <span class="social-name">
          Send a Message
        </span>


        <span class="arrow">
          →
        </span>

      </button>


    </div>



    <!-- =========================
         MESSAGE MODAL
    ========================== -->

    <div
      class="message-modal"
      id="message-modal"
      aria-hidden="true"
    >


      <!-- BACKDROP -->

      <div
        class="modal-backdrop"
        id="modal-backdrop"
      ></div>



      <!-- MESSAGE BOX -->

      <section class="message-box">


        <!-- CLOSE -->

        <button
          type="button"
          class="close-message"
          id="close-message"
          aria-label="Close"
        >

          ×

        </button>



        <!-- HEADER -->

        <div class="message-header">


          <div class="message-title-icon">

            <i class="fa-solid fa-envelope"></i>

          </div>


          <div>

            <h2>
              Send a Message
            </h2>


            <p>
              I'd love to hear from you.
            </p>

          </div>


        </div>



        <!-- FORM -->

        <form id="contact-form">


          <!-- NAME -->

          <input
            type="text"
            name="name"
            placeholder="Your Name"
            autocomplete="name"
            required
          >



          <!-- EMAIL -->

          <input
            type="email"
            name="email"
            placeholder="Your Email"
            autocomplete="email"
            required
          >



          <!-- MESSAGE -->

          <textarea
            name="message"
            placeholder="Write your message..."
            rows="5"
            required
          ></textarea>



          <!-- SEND -->

          <button
            type="submit"
            class="send-btn"
            id="send-button"
          >

            <span id="send-text">
              Send Message
            </span>


            <span id="send-icon">
              ➤
            </span>

          </button>


        </form>



        <!-- STATUS -->

        <p
          id="form-status"
          class="form-status"
        ></p>


      </section>


    </div>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

      <p>&copy; 2026 ALL RIGHT RESERVED.</p>

    </footer>


  </main>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>


    /* =================================
       BACKGROUND MUSIC
    ================================= */

    const music =
      document.getElementById(
        "background-music"
      );


    music.volume = 0.35;


    /*
      Try to play immediately
      when the website loads.
    */

    window.addEventListener(
      "load",
      function() {

        music.play().catch(function(error) {

          console.log(
            "Browser blocked autoplay:",
            error
          );

        });

      }
    );



    /* =================================
       MESSAGE MODAL
    ================================= */

    const openMessage =
      document.getElementById(
        "open-message"
      );


    const closeMessage =
      document.getElementById(
        "close-message"
      );


    const messageModal =
      document.getElementById(
        "message-modal"
      );


    const modalBackdrop =
      document.getElementById(
        "modal-backdrop"
      );



    /* =================================
       OPEN MODAL
    ================================= */

    function openModal() {

      messageModal.classList.add(
        "active"
      );


      messageModal.setAttribute(
        "aria-hidden",
        "false"
      );


      document.body.classList.add(
        "modal-open"
      );

    }



    /* =================================
       CLOSE MODAL
    ================================= */

    function closeModal() {

      messageModal.classList.remove(
        "active"
      );


      messageModal.setAttribute(
        "aria-hidden",
        "true"
      );


      document.body.classList.remove(
        "modal-open"
      );

    }



    openMessage.addEventListener(
      "click",
      openModal
    );


    closeMessage.addEventListener(
      "click",
      closeModal
    );


    modalBackdrop.addEventListener(
      "click",
      closeModal
    );



    /* =================================
       ESC KEY
    ================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          messageModal.classList.contains("active")
        ) {

          closeModal();

        }

      }
    );



    /* =================================
       EMAILJS
    ================================= */

    const form =
      document.getElementById(
        "contact-form"
      );


    const button =
      document.getElementById(
        "send-button"
      );


    const sendText =
      document.getElementById(
        "send-text"
      );


    const sendIcon =
      document.getElementById(
        "send-icon"
      );


    const status =
      document.getElementById(
        "form-status"
      );



    form.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        button.disabled = true;


        sendText.textContent =
          "Sending...";


        sendIcon.textContent =
          "⏳";


        status.textContent =
          "";


        status.className =
          "form-status";



        emailjs.sendForm(

          "service_mdvmj8k",

          "template_1fz2w1p",

          form

        )


        .then(function(response) {

          console.log(
            "EmailJS Success:",
            response.status,
            response.text
          );


          status.textContent =
            "✓ Message sent successfully!";


          status.className =
            "form-status success";


          form.reset();


          sendText.textContent =
            "Message Sent";


          sendIcon.textContent =
            "✓";


          setTimeout(
            function() {

              closeModal();


              sendText.textContent =
                "Send Message";


              sendIcon.textContent =
                "➤";


              button.disabled =
                false;


              status.textContent =
                "";

            },
            2000
          );


        })


        .catch(function(error) {

          console.error(
            "EmailJS Error:",
            error
          );


          status.textContent =
            "✕ Failed to send. Please try again.";


          status.className =
            "form-status error";


          sendText.textContent =
            "Try Again";


          sendIcon.textContent =
            "↻";


          button.disabled =
            false;

        });

      }
    );


  </script>


</body>

  </html>

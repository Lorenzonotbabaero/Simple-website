<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lorenzo II C. Badilla</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Background Video -->
  <video class="background-video" autoplay muted loop playsinline>
    <source src="Files/an.mp4" type="video/mp4">
  </video>

  <div class="video-overlay"></div>

  <main class="container">

    <!-- Profile -->
    <div class="profile">
      <img src="Files/photo.jpeg" alt="Lorenzo II C. Badilla">
    </div>

    <h1>Lorenzo II C. Badilla</h1>

    <p class="description">
      Welcome to my personal website.
    </p>

    <!-- Social Buttons -->
    <div class="socials">

      <!-- TikTok -->
      <a
        class="social-btn tiktok"
        href="https://www.tiktok.com/@loren.zoofficial"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="Files/tiktok.png"
          alt="TikTok"
          class="social-logo"
        >

        <span class="social-name">TikTok</span>

        <span class="arrow">→</span>
      </a>


      <!-- Facebook -->
      <a
        class="social-btn facebook"
        href="https://www.facebook.com/share/1JCAwrrqA8/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="Files/facebook.png"
          alt="Facebook"
          class="social-logo"
        >

        <span class="social-name">Facebook</span>

        <span class="arrow">→</span>
      </a>


      <!-- Instagram -->
      <a
        class="social-btn instagram"
        href="https://www.instagram.com/lor.zxa?stkn=OGl2Yjl0MzRxaHFq"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="Files/instagram.jpg"
          alt="Instagram"
          class="social-logo"
        >

        <span class="social-name">Instagram</span>

        <span class="arrow">→</span>
      </a>

    </div>

    <footer>
      © 2026 ALL RIGHT RESERVE 
    </footer>

  </main>

</body>
</html>

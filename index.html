<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lorenzo II C. Badilla</title>

  <link rel="stylesheet" href="style.css">

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <script>
    emailjs.init({
      publicKey: "yWCbXVy9EpRv6Dt_c"
    });
  </script>
</head>

<body>

  <!-- BACKGROUND VIDEO -->
  <video
    class="background-video"
    autoplay
    muted
    loop
    playsinline
    preload="auto"
  >
    <source src="Files/an.mp4" type="video/mp4">
  </video>

  <div class="video-overlay"></div>


  <!-- MAIN -->
  <main class="container">

    <!-- PROFILE -->
    <div class="profile">
      <img
        src="Files/photo.jpeg"
        alt="Lorenzo II C. Badilla"
      >
    </div>


    <!-- NAME -->
    <h1>Lorenzo II C. Badilla</h1>

    <p class="description">
      Welcome to my personal website.
    </p>


    <!-- SOCIAL BUTTONS -->
    <div class="socials">

      <!-- TIKTOK -->
      <a
        class="social-btn tiktok"
        href="https://www.tiktok.com/@loren.zoofficial"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="Files/tiktok.png"
          alt="TikTok"
          class="social-logo"
        >

        <span class="social-name">
          TikTok
        </span>

        <span class="arrow">→</span>
      </a>


      <!-- FACEBOOK -->
      <a
        class="social-btn facebook"
        href="https://www.facebook.com/share/1JCAwrrqA8/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="Files/facebook.png"
          alt="Facebook"
          class="social-logo"
        >

        <span class="social-name">
          Facebook
        </span>

        <span class="arrow">→</span>
      </a>


      <!-- INSTAGRAM -->
      <a
        class="social-btn instagram"
        href="https://www.instagram.com/lor.zxa?stkn=OGl2Yjl0MzRxaHFq"
        target="_blank"
        rel="noopener noreferrer"
      >
        <img
          src="Files/instagram.jpeg"
          alt="Instagram"
          class="social-logo"
        >

        <span class="social-name">
          Instagram
        </span>

        <span class="arrow">→</span>
      </a>


      <!-- SEND MESSAGE -->
      <a
        href="#message"
        class="social-btn message-btn"
      >

        <span class="message-icon">
          <img
            src="Files/message.png"
            alt="Message"
          >
        </span>

        <span class="social-name">
          Send a Message
        </span>

        <span class="arrow">→</span>

      </a>

    </div>


    <!-- MESSAGE FORM -->
    <section
      id="message"
      class="message-box"
    >

      <div class="message-header">

        <div class="message-title-icon">
          <img
            src="Files/message.png"
            alt="Message"
          >
        </div>

        <div>
          <h2>Send a Message</h2>

          <p>
            I'd love to hear from you.
          </p>
        </div>

      </div>


      <!-- CONTACT FORM -->
      <form id="contact-form">

        <!-- NAME -->
        <input
          type="text"
          name="name"
          placeholder="Your Name"
          autocomplete="name"
          required
        >


        <!-- EMAIL -->
        <input
          type="email"
          name="email"
          placeholder="Your Email"
          autocomplete="email"
          required
        >


        <!-- MESSAGE -->
        <textarea
          name="message"
          placeholder="Write your message..."
          rows="5"
          required
        ></textarea>


        <!-- SEND BUTTON -->
        <button
          type="submit"
          class="send-btn"
          id="send-button"
        >

          <span id="send-text">
            Send Message
          </span>

          <span id="send-icon">
            ➤
          </span>

        </button>

      </form>


      <!-- STATUS -->
      <p
        id="form-status"
        class="form-status"
      ></p>

    </section>


    <!-- FOOTER -->
    <footer>
      © 2026 Lorenzo II C. Badilla
    </footer>

  </main>


  <!-- EMAILJS -->
  <script>

    const form =
      document.getElementById("contact-form");

    const button =
      document.getElementById("send-button");

    const sendText =
      document.getElementById("send-text");

    const sendIcon =
      document.getElementById("send-icon");

    const status =
      document.getElementById("form-status");


    form.addEventListener("submit", function(event) {

      event.preventDefault();


      button.disabled = true;

      sendText.textContent =
        "Sending...";

      sendIcon.textContent =
        "⏳";

      status.textContent = "";

      status.className =
        "form-status";


      /* SEND EMAIL */

      emailjs.sendForm(
        "service_mdvmj8k",
        "template_1fz2w1p",
        form
      )

      .then(function(response) {

        console.log(
          "EMAIL SENT:",
          response.status,
          response.text
        );


        status.textContent =
          "✓ Message sent successfully!";

        status.className =
          "form-status success";


        form.reset();


        sendText.textContent =
          "Message Sent";

        sendIcon.textContent =
          "✓";


        setTimeout(function() {

          sendText.textContent =
            "Send Message";

          sendIcon.textContent =
            "➤";

          button.disabled =
            false;

        }, 3000);

      })


      .catch(function(error) {

        console.error(
          "EMAILJS ERROR:",
          error
        );


        status.textContent =
          "✕ Failed to send message. Please try again.";

        status.className =
          "form-status error";


        sendText.textContent =
          "Try Again";

        sendIcon.textContent =
          "↻";


        button.disabled =
          false;

      });

    });

  </script>

</body>

</html>

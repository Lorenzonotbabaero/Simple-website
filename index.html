    * {
      margin: 0;

    body {
      min-height: 100vh;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .container {
      width: 90%;
      max-width: 600px;
      padding: 40px 25px;
    }

    /* Profile Picture */
    .profile {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 20px;
      overflow: hidden;
      border: 2px solid #555;
      background: #1c1c1c;
    }

    .profile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Name */
    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    /* Description */
    .description {
      color: #aaa;
      margin-bottom: 30px;
      font-size: 16px;
    }

    /* Social Media Buttons */
    .socials {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .socials a {
      text-decoration: none;
      color: white;
      background: #1c1c1c;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #333;
      transition: 0.3s;
      font-weight: bold;
    }

    .socials a:hover {
      transform: translateY(-3px);
      background: #292929;
      border-color: #777;
    }

    /* Footer */
    footer {
      margin-top: 35px;
      color: #666;
      font-size: 13px;
    }

    /* Mobile */
    @media (max-width: 500px) {
      h1 {
        font-size: 26px;
      }

      .profile {
        width: 100px;
        height: 100px;
      }
    }
